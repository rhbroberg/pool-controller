---
swagger: "2.0"
info:
  description: "The API for the Pool Controller IOT project"
  version: "1.0.0"
  title: "pool-iot-api"
host: "virtserver.swaggerhub.com"
basePath: "/rhbroberg/pool-api/1.0.0"
schemes:
- "https"
consumes:
- "application/json"
produces:
- "application/json"
paths:
  /devices:
    get:
      tags:
      - "Device"
      description: "returns all configured devices"
      operationId: "getDevices"
      parameters:
      - name: "skip"
        in: "query"
        description: "number of records to skip"
        required: false
        type: "integer"
        format: "int32"
      - name: "limit"
        in: "query"
        description: "max number of records to return"
        required: false
        type: "integer"
        format: "int32"
      responses:
        200:
          description: "All the devices"
          schema:
            type: "array"
            items:
              type: "string"
              format: "uri"
              example: "valve4 aux1"
      x-swagger-router-controller: "Device"
  /devices/{deviceId}/register:
    put:
      tags:
      - "Device"
      operationId: "registerDevice"
      parameters:
      - name: "deviceId"
        in: "path"
        required: true
        type: "string"
      responses:
        200:
          description: "successfully registered device"
          schema:
            $ref: "#/definitions/DeviceRegistrationInfo"
      security:
      - OAuth2:
        - "admin"
      x-swagger-router-controller: "Device"
  /devices/{deviceId}/{state}:
    put:
      tags:
      - "Device"
      operationId: "setDeviceState"
      description: "sets a controller button's device on or off; nothing is sent if it is already in that state"
      parameters:
      - name: "deviceId"
        in: "path"
        description: "a controller button such as filter, lights, heater1, superchlorinate, aux3, aux5 or aux14; the panel's names spafilter (aux14), yardlights (aux3) and blower (aux5) are also accepted"
        required: true
        type: "string"
      - name: "state"
        in: "path"
        required: true
        type: "string"
        enum:
        - "false"
        - "true"
      responses:
        200:
          description: "set device state"
          schema:
            $ref: "#/definitions/DeviceState"
      security:
      - OAuth2:
        - "control"
      x-swagger-router-controller: "Device"
  /devices/{deviceId}:
    get:
      tags:
      - "Device"
      operationId: "getDeviceState"
      parameters:
      - name: "deviceId"
        in: "path"
        description: "a status switch name; spafilter, yardlights and blower are accepted for aux14, aux3 and aux5"
        required: true
        type: "string"
      responses:
        200:
          description: "get device state"
          schema:
            $ref: "#/definitions/DeviceState"
      x-swagger-router-controller: "Device"
  /status:
    get:
      tags:
      - "Status"
      description: "returns the most recent recorded value of every status and info reading"
      operationId: "getCurrentStatus"
      parameters: []
      responses:
        200:
          description: "latest value for each reading"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/StatusValue"
      x-swagger-router-controller: "Status"
  /history:
    get:
      tags:
      - "History"
      description: "recorded readings for each name in a time window. Readings are stored when they change, so each series also has the value in effect when the window opens."
      operationId: "getHistory"
      parameters:
      - name: "names"
        in: "query"
        description: "readings to return, such as pool temp, spa temp, ambient, heater1, aux14"
        required: true
        type: "array"
        items:
          type: "string"
        collectionFormat: "csv"
      - name: "from"
        in: "query"
        description: "start of the window (ISO 8601); defaults to 24 hours before to"
        required: false
        type: "string"
      - name: "to"
        in: "query"
        description: "end of the window (ISO 8601), exclusive; defaults to now"
        required: false
        type: "string"
      - name: "maxPoints"
        in: "query"
        description: "most readings per series; larger windows are thinned to this many (default 2000)"
        required: false
        type: "integer"
      responses:
        200:
          description: "readings for each name"
          schema:
            $ref: "#/definitions/History"
        400:
          description: "the names or dates are not usable"
          schema:
            $ref: "#/definitions/ApiResponse"
      x-swagger-router-controller: "History"
  /panel/display:
    get:
      tags:
      - "Panel"
      description: "returns the most recent text shown on the panel display"
      operationId: "getPanelDisplay"
      parameters: []
      responses:
        200:
          description: "the panel display"
          schema:
            $ref: "#/definitions/PanelDisplay"
        404:
          description: "the panel has not reported any display text yet"
          schema:
            $ref: "#/definitions/ApiResponse"
      x-swagger-router-controller: "Panel"
  /panel/keys/{key}:
    put:
      tags:
      - "Panel"
      description: "presses one panel key, as the wireless remote would"
      operationId: "pressPanelKey"
      parameters:
      - name: "key"
        in: "path"
        required: true
        type: "string"
        enum:
        - "menu"
        - "left"
        - "right"
        - "minus"
        - "plus"
      responses:
        200:
          description: "the key press is queued for the next controller ping"
          schema:
            $ref: "#/definitions/PanelKeyPress"
      security:
      - OAuth2:
        - "control"
      x-swagger-router-controller: "Panel"
  /filtration:
    get:
      tags:
      - "Filtration"
      description: "returns all filtration devices"
      operationId: "getFiltrationDevices"
      parameters: []
      responses:
        200:
          description: "All the devices"
          schema:
            type: "array"
            items:
              type: "string"
              format: "uri"
              example: "pool"
      x-swagger-router-controller: "Filtration"
  /filtration/{pumpId}/{state}:
    put:
      tags:
      - "Filtration"
      operationId: "setFiltrationState"
      parameters:
      - name: "pumpId"
        in: "path"
        required: true
        type: "string"
      - name: "state"
        in: "path"
        required: true
        type: "string"
        enum:
        - "false"
        - "true"
      responses:
        200:
          description: "response"
          schema:
            $ref: "#/definitions/ApiResponse"
      security:
      - OAuth2:
        - "control"
      x-swagger-router-controller: "Filtration"
  /filtration/{pumpId}:
    get:
      tags:
      - "Filtration"
      operationId: "getFiltrationState"
      parameters:
      - name: "pumpId"
        in: "path"
        required: true
        type: "string"
      responses:
        200:
          description: "response"
          schema:
            $ref: "#/definitions/ApiResponse"
      x-swagger-router-controller: "Filtration"
  /temperature:
    get:
      tags:
      - "Environment"
      operationId: "temperatureSummary"
      parameters: []
      responses:
        200:
          description: "ok"
          schema:
            $ref: "#/definitions/TemperatureSummary"
      x-swagger-router-controller: "Environment"
  /temperature/{poolId}:
    get:
      tags:
      - "Environment"
      operationId: "getPoolTemperature"
      parameters:
      - name: "poolId"
        in: "path"
        required: true
        type: "string"
        enum:
        - "pool"
        - "spa"
      - name: "date"
        in: "query"
        description: "historical date bracket"
        required: false
        type: "string"
      - name: "limit"
        in: "query"
        description: "result set maximum size"
        required: false
        type: "integer"
        default: 0
      responses:
        200:
          description: "Zone temperature"
          schema:
            $ref: "#/definitions/TemperatureZoneStatus"
      x-swagger-router-controller: "Environment"
  /temperature/heater/{poolId}:
    get:
      tags:
      - "Environment"
      description: "gets the state of the heater"
      operationId: "getHeaterState"
      parameters:
      - name: "poolId"
        in: "path"
        required: true
        type: "string"
        enum:
        - "pool"
        - "spa"
      responses:
        200:
          description: "heater state"
          schema:
            $ref: "#/definitions/HeaterState"
      x-swagger-router-controller: "Environment"
  /temperature/heater/{poolId}/{state}:
    put:
      tags:
      - "Environment"
      description: "turns the heater on or off"
      operationId: "setHeaterState"
      parameters:
      - name: "poolId"
        in: "path"
        required: true
        type: "string"
        enum:
        - "pool"
        - "spa"
      - name: "state"
        in: "path"
        required: true
        type: "string"
        enum:
        - "off"
        - "on"
      responses:
        200:
          description: "Status of the operation"
          schema:
            $ref: "#/definitions/HeaterState"
      security:
      - OAuth2:
        - "control"
      x-swagger-router-controller: "Environment"
  /lighting:
    get:
      tags:
      - "Lighting"
      operationId: "getLights"
      parameters: []
      responses:
        200:
          description: "ok"
          schema:
            type: "array"
            items:
              type: "string"
      x-swagger-router-controller: "Lighting"
  /lighting/{lightId}:
    get:
      tags:
      - "Lighting"
      operationId: "getLightingState"
      parameters:
      - name: "lightId"
        in: "path"
        required: true
        type: "string"
        enum:
        - "underwater"
        - "yard"
      responses:
        200:
          description: "ok"
          schema:
            $ref: "#/definitions/LightingZoneStatus"
      x-swagger-router-controller: "Lighting"
  /lighting/{lightId}/{state}:
    put:
      tags:
      - "Lighting"
      operationId: "setLightingState"
      parameters:
      - name: "lightId"
        in: "path"
        required: true
        type: "string"
      - name: "state"
        in: "path"
        required: true
        type: "string"
        enum:
        - "false"
        - "true"
      responses:
        200:
          description: "Status of the operation"
          schema:
            $ref: "#/definitions/LightingZoneStatus"
      security:
      - OAuth2:
        - "control"
      x-swagger-router-controller: "Lighting"
  /users:
    get:
      tags:
      - "User management"
      description: "admin: every account and its role"
      operationId: "listUsers"
      parameters: []
      responses:
        200:
          description: "the accounts, by name"
          schema:
            type: "array"
            items:
              $ref: "#/definitions/Account"
      security:
      - OAuth2:
        - "admin"
      x-swagger-router-controller: "UserManagement"
    post:
      tags:
      - "User management"
      description: "admin: adds an account; role defaults to user"
      operationId: "createUser"
      parameters:
      - in: "body"
        name: "account"
        description: "the account name (in email), password and role"
        required: true
        schema:
          $ref: "#/definitions/User"
      responses:
        200:
          description: "the new account"
          schema:
            $ref: "#/definitions/Account"
        400:
          description: "the name, password or role is not acceptable"
          schema:
            $ref: "#/definitions/ApiResponse"
        409:
          description: "another account already has that name"
          schema:
            $ref: "#/definitions/ApiResponse"
      security:
      - OAuth2:
        - "admin"
      x-swagger-router-controller: "UserManagement"
  /users/login:
    post:
      tags:
      - "User management"
      description: "signs in; send the returned token as the x-auth header"
      operationId: "loginUser"
      parameters:
      - in: "body"
        name: "credentials"
        description: "the account name (in email) and password"
        required: true
        schema:
          $ref: "#/definitions/User"
      responses:
        200:
          description: "the account, its role and a token"
          schema:
            $ref: "#/definitions/User"
        401:
          description: "the name or password is wrong"
          schema:
            $ref: "#/definitions/ApiResponse"
      x-swagger-router-controller: "UserManagement"
  /users/me:
    get:
      tags:
      - "User management"
      description: "the signed-in account and its role"
      operationId: "getUser"
      parameters: []
      responses:
        200:
          description: "the signed-in account"
          schema:
            $ref: "#/definitions/Account"
      security:
      - OAuth2:
        - "account"
      x-swagger-router-controller: "UserManagement"
  /users/me/token:
    delete:
      tags:
      - "User management"
      description: "signs this token out"
      operationId: "logoutUser"
      parameters: []
      responses:
        200:
          description: "signed out"
          schema:
            $ref: "#/definitions/ApiResponse"
      security:
      - OAuth2:
        - "account"
      x-swagger-router-controller: "UserManagement"
  /users/{name}:
    put:
      tags:
      - "User management"
      description: "admin: changes an account's role, or resets its password and signs it out everywhere. The last admin cannot be demoted."
      operationId: "updateUser"
      parameters:
      - name: "name"
        in: "path"
        required: true
        type: "string"
      - in: "body"
        name: "changes"
        description: "a new role, a new password, or both"
        required: true
        schema:
          $ref: "#/definitions/AccountUpdate"
      responses:
        200:
          description: "the updated account"
          schema:
            $ref: "#/definitions/Account"
        404:
          description: "there is no account with that name"
          schema:
            $ref: "#/definitions/ApiResponse"
        409:
          description: "the change would leave no admin"
          schema:
            $ref: "#/definitions/ApiResponse"
      security:
      - OAuth2:
        - "admin"
      x-swagger-router-controller: "UserManagement"
    delete:
      tags:
      - "User management"
      description: "admin: removes an account. The last admin cannot be removed."
      operationId: "deleteUser"
      parameters:
      - name: "name"
        in: "path"
        required: true
        type: "string"
      responses:
        200:
          description: "the account is gone"
          schema:
            $ref: "#/definitions/ApiResponse"
        404:
          description: "there is no account with that name"
          schema:
            $ref: "#/definitions/ApiResponse"
        409:
          description: "it is the only admin"
          schema:
            $ref: "#/definitions/ApiResponse"
      security:
      - OAuth2:
        - "admin"
      x-swagger-router-controller: "UserManagement"
  /users/me/credentials:
    put:
      tags:
      - "User management"
      description: "renames the signed-in account and sets its password: how any account changes its own password, and how the default admin account is commissioned. Earlier tokens for the account stop working."
      operationId: "changeCredentials"
      parameters:
      - in: "body"
        name: "credentials"
        description: "the account name (in email) and new password"
        required: true
        schema:
          $ref: "#/definitions/User"
      responses:
        200:
          description: "the account's new name and a new token"
          schema:
            $ref: "#/definitions/User"
        400:
          description: "the name or password is not acceptable"
          schema:
            $ref: "#/definitions/ApiResponse"
        409:
          description: "another account already has that name"
          schema:
            $ref: "#/definitions/ApiResponse"
      security:
      - OAuth2:
        - "account"
      x-swagger-router-controller: "UserManagement"
  /system/factory-reset:
    post:
      tags:
      - "System"
      description: "erases all history and accounts, then recreates the admin / admin account"
      operationId: "factoryReset"
      parameters: []
      responses:
        200:
          description: "the reset is complete"
          schema:
            $ref: "#/definitions/ApiResponse"
      security:
      - OAuth2:
        - "admin"
      x-swagger-router-controller: "System"
  /system/restart:
    post:
      tags:
      - "System"
      description: "exits the server so its container restart policy starts it again"
      operationId: "restartServer"
      parameters: []
      responses:
        200:
          description: "the server is about to exit"
          schema:
            $ref: "#/definitions/ApiResponse"
      security:
      - OAuth2:
        - "admin"
      x-swagger-router-controller: "System"
securityDefinitions:
  BasicAuth:
    type: "basic"
  ApiKeyAuth:
    type: "apiKey"
    name: "X-API-Key"
    in: "header"
  OAuth2:
    type: "oauth2"
    description: "Sign in with POST /users/login and send the returned token as the x-auth header. Reads need no token. Each account's role grants scopes: viewer has account; user has account and control; admin has all three. An operation's listed scopes must all be granted, or it is refused with 403."
    authorizationUrl: "http://localhost:8080"
    tokenUrl: "https://localhost:8080/oauth/redirect"
    flow: "accessCode"
    scopes:
      account: "your own account: change its name and password, see it, sign out (viewer, user, admin)"
      control: "change equipment and press panel keys (user, admin)"
      admin: "manage accounts, restart the server, factory reset (admin)"
definitions:
  User:
    type: "object"
    properties:
      email:
        type: "string"
        description: "the account name; historically an email address"
      password:
        type: "string"
      role:
        type: "string"
        description: "viewer, user or admin; only used when an admin creates an account"
        enum:
        - "viewer"
        - "user"
        - "admin"
      token:
        type: "string"
        description: "returned by login and changeCredentials; send it as the x-auth header"
      mustChangeCredentials:
        type: "boolean"
        description: "true for the default admin account, whose token only works for changeCredentials until it is renamed"
    example:
      password: "password"
      email: "email"
  Account:
    type: "object"
    properties:
      email:
        type: "string"
        description: "the account name"
      role:
        type: "string"
        enum:
        - "viewer"
        - "user"
        - "admin"
      mustChangeCredentials:
        type: "boolean"
    example:
      email: "rick"
      role: "admin"
      mustChangeCredentials: false
  AccountUpdate:
    type: "object"
    properties:
      role:
        type: "string"
        enum:
        - "viewer"
        - "user"
        - "admin"
      password:
        type: "string"
        description: "a new password; the account is signed out everywhere"
    example:
      role: "viewer"
  LightingZone:
    type: "object"
    properties:
      id:
        type: "string"
      name:
        type: "string"
      deviceId:
        type: "integer"
        format: "int32"
      deviceType:
        type: "string"
        enum:
        - "dimmer"
        - "switch"
      zone:
        type: "string"
  LightingZoneStatus:
    type: "object"
    properties:
      id:
        type: "string"
      name:
        type: "string"
      lastUpdate:
        type: "string"
        format: "date-time"
      level:
        type: "integer"
        format: "int32"
    description: "the status of the lighting zone."
    example:
      level: 0
      lastUpdate: "2000-01-23T04:56:07.000+00:00"
      name: "name"
      id: "id"
  TemperatureSummary:
    type: "object"
    properties:
      zones:
        type: "array"
        items:
          $ref: "#/definitions/TemperatureZone"
      zoneStatus:
        type: "array"
        items:
          $ref: "#/definitions/TemperatureZoneStatus"
    description: "ok"
    example:
      zoneStatus:
      - name: "name"
        id: "id"
        units: "fahrenheit"
        value: 5
        timestamp: "2000-01-23T04:56:07.000+00:00"
      - name: "name"
        id: "id"
        units: "fahrenheit"
        value: 5
        timestamp: "2000-01-23T04:56:07.000+00:00"
      zones:
      - inputPosition: 6
        outputPosition: 1
        zone: "zone"
        name: "name"
        id: 0
      - inputPosition: 6
        outputPosition: 1
        zone: "zone"
        name: "name"
        id: 0
  TemperatureZone:
    type: "object"
    required:
    - "id"
    - "name"
    properties:
      id:
        type: "integer"
        format: "int32"
        description: "the unique identifier for the zone"
      name:
        type: "string"
      inputPosition:
        type: "integer"
        format: "int32"
      outputPosition:
        type: "integer"
        format: "int32"
      zone:
        type: "string"
    description: "a single temperature zone"
    example:
      inputPosition: 6
      outputPosition: 1
      zone: "zone"
      name: "name"
      id: 0
  TemperatureZoneStatus:
    type: "object"
    required:
    - "id"
    - "timestamp"
    - "value"
    properties:
      id:
        type: "string"
        description: "the unique identifier for the zone"
      name:
        type: "string"
        description: "the name of the zone"
      value:
        type: "integer"
        format: "int32"
        description: "the temperature in the zone"
      units:
        type: "string"
        description: "the temperature units"
        default: "fahrenheit"
        enum:
        - "celcius"
        - "fahrenheit"
      timestamp:
        type: "string"
        format: "date-time"
        description: "the timestamp when the temperature was measured"
    description: "status of a single zone"
    example:
      name: "name"
      id: "id"
      units: "fahrenheit"
      value: 5
      timestamp: "2000-01-23T04:56:07.000+00:00"
  ApiResponse:
    type: "object"
    properties:
      code:
        type: "integer"
        format: "int32"
      message:
        type: "string"
        example: "everything is ok"
    example:
      code: 0
      message: "everything is ok"
  HeaterState:
    type: "object"
    properties:
      id:
        type: "string"
      state:
        type: "string"
        enum:
        - "on"
        - "off"
      setPoint:
        type: "integer"
        format: "int32"
        description: "goal temperature for heater"
      units:
        type: "string"
        description: "the temperature units"
        default: "fahrenheit"
        enum:
        - "celcius"
        - "fahrenheit"
      timestamp:
        type: "string"
        format: "date-time"
        description: "the timestamp when the temperature was measured"
    example:
      setPoint: 0
      id: "id"
      state: "on"
      units: "fahrenheit"
      timestamp: "2000-01-23T04:56:07.000+00:00"
  DeviceState:
    type: "object"
    properties:
      id:
        type: "string"
      name:
        type: "string"
      value:
        type: "string"
      previousValue:
        type: "string"
        description: "the state before a set request; the change is confirmed by a later status frame"
      lastUpdate:
        type: "string"
        format: "date-time"
    example:
      lastUpdate: "2000-01-23T04:56:07.000+00:00"
      name: "name"
      id: "id"
      value: "value"
  HistoryPoint:
    type: "object"
    properties:
      t:
        type: "string"
        format: "date-time"
      v:
        type: "number"
  HistorySeries:
    type: "object"
    properties:
      name:
        type: "string"
      before:
        $ref: "#/definitions/HistoryPoint"
      points:
        type: "array"
        items:
          $ref: "#/definitions/HistoryPoint"
      downsampled:
        type: "boolean"
        description: "true when the window held more readings than maxPoints"
  History:
    type: "object"
    properties:
      from:
        type: "string"
        format: "date-time"
      to:
        type: "string"
        format: "date-time"
      earliest:
        type: "string"
        format: "date-time"
        description: "the oldest recorded reading of any kind"
      series:
        type: "array"
        items:
          $ref: "#/definitions/HistorySeries"
  PanelDisplay:
    type: "object"
    required:
    - "lines"
    - "blinking"
    - "timestamp"
    properties:
      lines:
        type: "array"
        description: "each line of the display, 20 characters wide"
        items:
          type: "string"
      blinking:
        type: "array"
        description: "for each line, the positions of characters the panel is blinking"
        items:
          type: "array"
          items:
            type: "integer"
      timestamp:
        type: "string"
        format: "date-time"
        description: "when the panel sent this text"
    example:
      lines:
      - "      Saturday      "
      - "        6:42A       "
      blinking:
      - []
      - [9]
      timestamp: "2000-01-23T04:56:07.000+00:00"
  PanelKeyPress:
    type: "object"
    properties:
      key:
        type: "string"
      requestedAt:
        type: "string"
        format: "date-time"
  StatusValue:
    type: "object"
    required:
    - "name"
    - "category"
    - "value"
    - "timestamp"
    properties:
      name:
        type: "string"
        description: "the reading name, as stored by the server"
      category:
        type: "string"
        description: "status for device switches, info for measurements from the display"
        enum:
        - "status"
        - "info"
      value:
        type: "number"
        description: "1 or 0 for switches; the measured value for info readings"
      timestamp:
        type: "string"
        format: "date-time"
        description: "when this value was recorded"
    example:
      name: "filter"
      category: "status"
      value: 1
      timestamp: "2000-01-23T04:56:07.000+00:00"
  DeviceRegistrationInfo:
    type: "object"
    properties:
      uri:
        type: "string"
        format: "uri"
        example: "http://10.0.0.220:8080"
      id:
        type: "string"
        format: "uuid"
        example: "0729a580-2240-11e6-9eb5-0002a5d5c51b"
    example:
      id: "0729a580-2240-11e6-9eb5-0002a5d5c51b"
      uri: "http://10.0.0.220:8080"
