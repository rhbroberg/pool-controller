openapi: 3.0.0
info:
  description: The API for the Pool Controller IOT project
  version: 1.0.0
  title: pool-iot-api
paths:
  /devices:
    get:
      tags:
        - Device
      description: returns all configured devices
      operationId: getDevices
      parameters:
        - name: skip
          in: query
          allowReserved: true
          description: number of records to skip
          required: false
          schema:
            type: integer
            format: int32
        - name: limit
          in: query
          allowReserved: true
          description: max number of records to return
          required: false
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: All the devices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uri
                  example: valve4 aux1
      x-swagger-router-controller: Device
  "/devices/{deviceId}/register":
    put:
      tags:
        - Device
      operationId: registerDevice
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: successfully registered device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistrationInfo"
      security:
        - OAuth2:
            - admin
      x-swagger-router-controller: Device
  "/devices/{deviceId}/{state}":
    put:
      tags:
        - Device
      operationId: setDeviceState
      description: sets a controller button's device on or off; nothing is sent if it
        is already in that state
      parameters:
        - name: deviceId
          in: path
          description: a controller button such as filter, lights, heater1, valve4,
            superchlorinate, aux3, aux5 or aux14; the panel's names spafilter
            (aux14), yardlights (aux3), blower (aux5) and heatpump (valve4) are
            also accepted
          required: true
          schema:
            type: string
        - name: state
          in: path
          required: true
          schema:
            type: string
            enum:
              - "false"
              - "true"
      responses:
        "200":
          description: set device state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceState"
      security:
        - OAuth2:
            - control
      x-swagger-router-controller: Device
  "/devices/{deviceId}":
    get:
      tags:
        - Device
      operationId: getDeviceState
      parameters:
        - name: deviceId
          in: path
          description: a status switch name; spafilter, yardlights, blower and heatpump
            are accepted for aux14, aux3, aux5 and valve4
          required: true
          schema:
            type: string
      responses:
        "200":
          description: get device state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceState"
      x-swagger-router-controller: Device
  /status:
    get:
      tags:
        - Status
      description: returns the most recent recorded value of every status and info reading
      operationId: getCurrentStatus
      responses:
        "200":
          description: latest value for each reading
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusValue"
      x-swagger-router-controller: Status
  /weather:
    get:
      tags:
        - Weather
      description: today's forecast at the pool's zip code, as last fetched by the
        weather job. configured is false until an admin sets a zip code in
        /system/settings; today is null until the first fetch has finished.
      operationId: getWeather
      responses:
        "200":
          description: today's forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Weather"
      x-swagger-router-controller: Weather
  /history:
    get:
      tags:
        - History
      description: recorded readings for each name in a time window. Readings are
        stored when they change, so each series also has the value in effect
        when the window opens.
      operationId: getHistory
      parameters:
        - name: names
          in: query
          allowReserved: true
          description: readings to return, such as pool temp, spa temp, ambient, heater1,
            valve4 (heat pump), aux14
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: from
          in: query
          allowReserved: true
          description: start of the window (ISO 8601); defaults to 24 hours before to
          required: false
          schema:
            type: string
        - name: to
          in: query
          allowReserved: true
          description: end of the window (ISO 8601), exclusive; defaults to now
          required: false
          schema:
            type: string
        - name: maxPoints
          in: query
          allowReserved: true
          description: most points per series, normally the graph's width in pixels. A
            series with no more readings than this gets every reading as recorded;
            otherwise one point per bucket of time, with buckets just long enough to
            keep within it (default 2000)
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 5000
        - name: resolution
          in: query
          allowReserved: true
          description: the shortest bucket, in seconds, when a series is bucketed. Buckets
            are 1, 2, 5, 10, 15 or 30 minutes, 1, 2, 3, 6 or 12 hours, or 1, 2, 7, 14 or
            30 days, on fixed boundaries (days start at local midnight), so the same
            window always gets the same buckets
          required: false
          schema:
            type: integer
            minimum: 60
      responses:
        "200":
          description: readings for each name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
        "400":
          description: the names or dates are not usable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      x-swagger-router-controller: History
  /history/availability:
    get:
      tags:
        - History
      description: which local days have pool or spa temperature or salt readings, for
        marking a calendar; air temperature doesn't count. Pass pool temp or spa temp
        to mark days that temperature was known while its pump ran, which is when its
        graph can draw it. Days are in the server's time zone. At most 1500 days at a time.
      operationId: getHistoryAvailability
      parameters:
        - name: names
          in: query
          allowReserved: true
          description: readings to mark, pool temp, spa temp or salt; defaults to all three
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
        - name: from
          in: query
          allowReserved: true
          description: start of the range (ISO 8601); defaults to 366 days before to
          required: false
          schema:
            type: string
        - name: to
          in: query
          allowReserved: true
          description: end of the range (ISO 8601), exclusive; defaults to now
          required: false
          schema:
            type: string
      responses:
        "200":
          description: the days with readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryAvailability"
        "400":
          description: the dates are not usable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      x-swagger-router-controller: History
  /events:
    get:
      tags:
        - Event log
      description: recorded events a page at a time, newest first unless order is asc.
        Pass the previous page's next as cursor for the following page.
      operationId: getEvents
      parameters:
        - name: types
          in: query
          allowReserved: true
          description: "event types to include (all by default): status (switches
            changing), info (readings), control (keypad and remote presses),
            action (signed-in accounts acting), failed and unrecognized (frames
            the server could not use)"
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - status
                - info
                - control
                - action
                - failed
                - unrecognized
        - name: user
          in: query
          allowReserved: true
          description: only this account's actions, or controller for events no account made
          required: false
          schema:
            type: string
        - name: cursor
          in: query
          allowReserved: true
          description: next from the previous page
          required: false
          schema:
            type: string
        - name: order
          in: query
          allowReserved: true
          required: false
          schema:
            type: string
            enum:
              - desc
              - asc
            default: desc
        - name: limit
          in: query
          allowReserved: true
          description: events per page, at most 200
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: a page of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "400":
          description: an unknown type or an unusable cursor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      x-swagger-router-controller: EventLog
  /events/users:
    get:
      tags:
        - Event log
      description: every account with a recorded action, for filtering the log
      operationId: getEventUsers
      responses:
        "200":
          description: account names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      x-swagger-router-controller: EventLog
  "/water/mode/{mode}":
    put:
      tags:
        - Water flow
      description: "sets the water flow to pool, spa or spillover. The controller's
        spillover key steps through those modes in that order, so the server
        presses it, one press per status change, until the mode is reached;
        nothing is sent if it already is. GET /status reports the current mode
        through the pool, spa and spillover switches: spillover if it is on,
        otherwise spa if it is on, otherwise pool."
      operationId: setWaterMode
      parameters:
        - name: mode
          in: path
          required: true
          schema:
            type: string
            enum:
              - pool
              - spa
              - spillover
      responses:
        "200":
          description: the change is under way
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaterMode"
        "400":
          description: the controller has not reported its mode yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - OAuth2:
            - control
      x-swagger-router-controller: Water
  /heating:
    get:
      tags:
        - Heating
      description: "every setpoint, and what the heater and heat pump are doing. They
        are in series, so both drive toward the setpoint of the same body of
        water: the spa while the spa filter (aux14) runs; otherwise, while the
        filter runs, the spa in spa flow and the pool in pool or spillover flow.
        A device that is enabled calls for heat only while that water is below
        its setpoint, and calls again once it cools. The heater's heating comes
        from the controller's firing signal; the heat pump has none, so it
        counts as heating while it is enabled and calling for heat. Until the
        server can read the controller's setpoints, setpointsReachController is
        false: each starts at 80°F and a change is kept by the server only."
      operationId: getHeating
      responses:
        "200":
          description: setpoints and heating state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Heating"
      x-swagger-router-controller: Heating
  /heating/model:
    get:
      tags:
        - Heating
      description: "what the server has learned from history about how each body of
        water warms and cools, which every heating estimate uses, with the range a
        scan covers by default (all of history except what the simulator made, from
        2026 on). model is null until one has been saved."
      operationId: getHeatingModel
      responses:
        "200":
          description: the model in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatingModelState"
      x-swagger-router-controller: Heating
    put:
      tags:
        - Heating
      description: keeps a previewed model, exactly as previewed, as the one every
        estimate uses from now on. The model it replaces is kept as a record.
      operationId: saveHeatingModel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeatingModelSave"
        required: true
      x-codegen-request-body-name: request
      responses:
        "200":
          description: the model now in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatingModelState"
        "400":
          description: the preview has no body of water with enough windows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "404":
          description: no such preview; it may have been replaced or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - OAuth2:
            - admin
      x-swagger-router-controller: Heating
  /heating/model/scan:
    post:
      tags:
        - Heating
      description: looks through stored history from `from` up to `to` for the windows
        to learn from, stretches in which a body of water had the same heat sources
        running while its temperature was followed. By default the range is all of
        history before the simulator's (2026). Answers at once; the scan goes on in
        the maintenance job queue and GET shows how it is going.
      operationId: startHeatingScan
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeatingScanRequest"
        required: false
      x-codegen-request-body-name: request
      responses:
        "202":
          description: the scan, waiting for or under way in the job queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatingScan"
        "400":
          description: a date that isn't one, or a range that ends before it starts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "409":
          description: history is already being scanned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - OAuth2:
            - admin
      x-swagger-router-controller: Heating
    get:
      tags:
        - Heating
      description: the scan under way, or the last one since the server started
      operationId: getHeatingScan
      responses:
        "200":
          description: the scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatingScan"
        "404":
          description: history hasn't been scanned since the server started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - OAuth2:
            - admin
      x-swagger-router-controller: Heating
  /heating/model/scan/windows:
    get:
      tags:
        - Heating
      description: every window the last finished scan found, with whether it is
        suitable to learn from and, if not, why
      operationId: getHeatingWindows
      responses:
        "200":
          description: the windows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatingWindows"
        "409":
          description: there is no finished scan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - OAuth2:
            - admin
      x-swagger-router-controller: Heating
  /heating/model/preview:
    post:
      tags:
        - Heating
      description: "fits a model to the suitable windows of the last scan that aren't
        left out and answers with it beside the model in use and what it says about
        warming at a few air temperatures. Nothing is kept until a preview is saved
        with PUT /heating/model."
      operationId: previewHeatingModel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeatingModelRequest"
        required: true
      x-codegen-request-body-name: request
      responses:
        "200":
          description: the calculated model, held for saving
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatingModelPreview"
        "400":
          description: a kind of window the server doesn't know
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "409":
          description: there is no finished scan, or it has been replaced by a newer one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - OAuth2:
            - admin
      x-swagger-router-controller: Heating
  "/heating/setpoints/{body}/{device}":
    get:
      tags:
        - Heating
      description: the setpoint one heating device uses for one body of water
      operationId: getSetpoint
      parameters:
        - $ref: "#/components/parameters/heatedBody"
        - $ref: "#/components/parameters/heatingDevice"
      responses:
        "200":
          description: the setpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setpoint"
      x-swagger-router-controller: Heating
  "/heating/setpoints/{body}/{device}/{degrees}":
    put:
      tags:
        - Heating
      description: sets the temperature one heating device drives one body of water toward
      operationId: setSetpoint
      parameters:
        - $ref: "#/components/parameters/heatedBody"
        - $ref: "#/components/parameters/heatingDevice"
        - name: degrees
          in: path
          required: true
          description: the setpoint in °F
          schema:
            type: integer
            minimum: 65
            maximum: 104
      responses:
        "200":
          description: the setpoint is changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetpointChange"
        "400":
          description: not a body, device or setpoint the controller has
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - OAuth2:
            - control
      x-swagger-router-controller: Heating
  /tasks:
    get:
      tags:
        - Tasks
      description: "the everyday jobs offered in place of single switches, each on when
        its switches are: pool (spillover water flow with the filter pump), spa preheat
        (the spa filter with the heater or heat pump enabled) and spa party (a preheat
        with the blower); with a spa preheat waiting to start in time for when it should
        be ready, and whether it's dark at the pool"
      operationId: getTasks
      responses:
        "200":
          description: the tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tasks"
      x-swagger-router-controller: Tasks
  /tasks/pool:
    put:
      tags:
        - Tasks
      description: on puts the water flow in spillover and runs the filter pump; off stops
        the filter pump and leaves the water flow as it is. The controller confirms each
        switch on a later status frame, so GET /tasks shows the task on once it has.
      operationId: setPoolTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskChange"
        required: true
      x-codegen-request-body-name: change
      responses:
        "200":
          description: the switches are asked for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tasks"
        "409":
          description: the controller couldn't take one of the switches yet; the others
            were asked for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - OAuth2:
            - control
      x-swagger-router-controller: Tasks
  /tasks/spaPreheat:
    put:
      tags:
        - Tasks
      description: on turns on the spa filter, heater and heat pump, now or, given readyAt,
        as late as the spa can still reach its setpoint by then; off stops the spa filter
        and drops a scheduled preheat
      operationId: setSpaPreheatTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaPreheatChange"
        required: true
      x-codegen-request-body-name: change
      responses:
        "200":
          description: the switches are asked for, or the preheat is scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tasks"
        "400":
          description: readyAt is not a time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "409":
          description: the controller couldn't take one of the switches yet; the others
            were asked for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - OAuth2:
            - control
      x-swagger-router-controller: Tasks
  /tasks/spaParty:
    put:
      tags:
        - Tasks
      description: on does what a spa preheat does now, and turns on the blower, and the
        lights when it's dark; off stops the spa filter, the blower and the lights
      operationId: setSpaPartyTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskChange"
        required: true
      x-codegen-request-body-name: change
      responses:
        "200":
          description: the switches are asked for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tasks"
        "409":
          description: the controller couldn't take one of the switches yet; the others
            were asked for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - OAuth2:
            - control
      x-swagger-router-controller: Tasks
  /panel/display:
    get:
      tags:
        - Panel
      description: returns the most recent text shown on the panel display
      operationId: getPanelDisplay
      responses:
        "200":
          description: the panel display
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelDisplay"
        "404":
          description: the panel has not reported any display text yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      x-swagger-router-controller: Panel
  "/panel/keys/{key}":
    put:
      tags:
        - Panel
      description: presses one panel key, as the wireless remote would
      operationId: pressPanelKey
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum:
              - menu
              - left
              - right
              - minus
              - plus
      responses:
        "200":
          description: the key press is queued for the next controller ping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelKeyPress"
      security:
        - OAuth2:
            - control
      x-swagger-router-controller: Panel
  /filtration:
    get:
      tags:
        - Filtration
      description: returns all filtration devices
      operationId: getFiltrationDevices
      responses:
        "200":
          description: All the devices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: uri
                  example: pool
      x-swagger-router-controller: Filtration
  "/filtration/{pumpId}/{state}":
    put:
      tags:
        - Filtration
      operationId: setFiltrationState
      parameters:
        - name: pumpId
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: path
          required: true
          schema:
            type: string
            enum:
              - "false"
              - "true"
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - OAuth2:
            - control
      x-swagger-router-controller: Filtration
  "/filtration/{pumpId}":
    get:
      tags:
        - Filtration
      operationId: getFiltrationState
      parameters:
        - name: pumpId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      x-swagger-router-controller: Filtration
  /temperature:
    get:
      tags:
        - Environment
      operationId: temperatureSummary
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemperatureSummary"
      x-swagger-router-controller: Environment
  "/temperature/{poolId}":
    get:
      tags:
        - Environment
      operationId: getPoolTemperature
      parameters:
        - name: poolId
          in: path
          required: true
          schema:
            type: string
            enum:
              - pool
              - spa
        - name: date
          in: query
          allowReserved: true
          description: historical date bracket
          required: false
          schema:
            type: string
        - name: limit
          in: query
          allowReserved: true
          description: result set maximum size
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Zone temperature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemperatureZoneStatus"
      x-swagger-router-controller: Environment
  "/temperature/heater/{poolId}":
    get:
      tags:
        - Environment
      description: gets the state of the heater
      operationId: getHeaterState
      parameters:
        - name: poolId
          in: path
          required: true
          schema:
            type: string
            enum:
              - pool
              - spa
      responses:
        "200":
          description: heater state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeaterState"
      x-swagger-router-controller: Environment
