        parser fix. Readings and switches are stored only when they change, so events are
        replayed in time order from what history held as the range opens. Events of the
        chosen kinds are rewritten from their raw frames; the others stay as they are. A
        frame that now changes nothing is removed, and one the server can't identify is
        kept as unrecognized. The hourly and daily summaries are then redone from `from`
        on. Answers at once; the run goes on in the maintenance job queue, and GET shows
        how it is going. With dryRun, only counts what would change.
      operationId: startReprocess
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReprocessRequest"
        required: true
      x-codegen-request-body-name: request
      responses:
        "202":
          description: the run, waiting for or under way in the job queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReprocessRun"
        "400":
          description: a date that isn't one, a range that ends before it starts, or an
            event type the server doesn't make from frames
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "409":
          description: history is already being reprocessed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - OAuth2:
            - admin
      x-swagger-router-controller: System
    get:
      tags:
        - System
      description: the reprocessing run under way, or the last one since the server started
      operationId: getReprocess
      responses:
        "200":
          description: the run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReprocessRun"
        "404":
          description: history hasn't been reprocessed since the server started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - OAuth2:
            - admin
      x-swagger-router-controller: System
  /system/restart:
    post:
      tags:
        - System
      description: exits the server so its container restart policy starts it again
      operationId: restartServer
      responses:
        "200":
          description: the server is about to exit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
      security:
        - OAuth2:
            - admin
      x-swagger-router-controller: System
servers:
  - url: /rhbroberg/pool-api/1.0.0
components:
  parameters:
    heatedBody:
      name: body
      in: path
      required: true
      description: the body of water
      schema:
        type: string
        enum:
          - pool
          - spa
    heatingDevice:
      name: device
      in: path
      required: true
      description: the heater (heater1) or the heat pump (valve4)
      schema:
        type: string
        enum:
          - heater1
          - heatpump
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    ApiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
    OAuth2:
      type: oauth2
      description: "Sign in with POST /users/login, or through a service from
        /auth/{provider}/start and then POST /users/login/external, and send the
        returned token as the x-auth header. Reads need no token. Each account's role grants scopes:
        viewer has account; user has account and control; admin has all three.
        An operation's listed scopes must all be granted, or it is refused with
        403."
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:3000
          tokenUrl: https://localhost:3000/oauth/redirect
          scopes:
            account: "your own account: change its name and password, see it, sign out
              (viewer, user, admin)"
            control: change equipment and press panel keys (user, admin)
            admin: manage accounts, restart the server, factory reset (admin)
  schemas:
    User:
      type: object
      properties:
        email:
          type: string
          description: the account name; historically an email address
        password:
          type: string
        role:
          type: string
          description: viewer, user or admin; only used when an admin creates an account
          enum:
            - viewer
            - user
            - admin
        token:
          type: string
          description: returned by login and changeCredentials; send it as the x-auth header
        mustChangeCredentials:
          type: boolean
          description: true for the default admin account, whose token only works for
            changeCredentials until it is renamed
      example:
        password: password
        email: email
    Account:
      type: object
      properties:
        email:
          type: string
          description: the account name
        role:
          type: string
          enum:
            - viewer
            - user
            - admin
        mustChangeCredentials:
          type: boolean
        methods:
          type: array
          description: how it signs in; password and/or the ids of sign-in services
          items:
            type: string
        displayName:
          type: string
          description: the name a sign-in service gave
      example:
        email: rick
        role: admin
        mustChangeCredentials: false
        methods:
          - password
          - google
    AccountUpdate:
      type: object
      properties:
        role:
          type: string
          enum:
            - viewer
            - user
            - admin
        password:
          type: string
          description: a new password; the account is signed out everywhere
      example:
        role: viewer
    Ticket:
      type: object
      required:
        - ticket
      properties:
        ticket:
          type: string
    SignInChoices:
      type: object
      properties:
        passwordSignIn:
          type: boolean
        providers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              displayName:
                type: string
    SignInService:
      type: object
      properties:
        id:
          type: string
          description: lowercase letters, digits and dashes; part of the callback address
        displayName:
          type: string
        kind:
          type: string
          description: oidc for any standard service; apple builds Apple's client secret
            from its key
          enum:
            - oidc
            - apple
        issuer:
          type: string
        clientId:
          type: string
        hasClientSecret:
          type: boolean
        apple:
          type: object
          properties:
            teamId:
              type: string
            keyId:
              type: string
            hasPrivateKey:
              type: boolean
        enabled:
          type: boolean
        trustEmail:
          type: boolean
          description: verified email addresses from this service may redeem invitations
        redirectUri:
          type: string
          description: register this with the service
    SignInServiceChange:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        kind:
          type: string
          enum:
            - oidc
            - apple
        issuer:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
          nullable: true
        apple:
          type: object
          properties:
            teamId:
              type: string
            keyId:
              type: string
            privateKey:
              type: string
        enabled:
          type: boolean
        trustEmail:
          type: boolean
    SignInSettings:
      type: object
      properties:
        passwordSignIn:
          type: boolean
        passwordSignInForced:
          type: boolean
          description: POOL_FORCE_PASSWORD_SIGNIN=1 keeps passwords working whatever the setting
        signInRequests:
          type: string
          enum:
            - ask
            - refuse
        redirectUriTemplate:
          type: string
        providers:
          type: array
          items:
            $ref: "#/components/schemas/SignInService"
    SignInSettingsUpdate:
      type: object
      properties:
        passwordSignIn:
          type: boolean
        signInRequests:
          type: string
          enum:
            - ask
            - refuse
    AccessRequest:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        providerName:
          type: string
        email:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - pending
            - denied
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        attempts:
          type: integer
    Invitation:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        provider:
          type: string
          nullable: true
          description: the one service it works with; null for any trusted for email
        providerName:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - viewer
            - user
            - admin
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
    LightingZone:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        deviceId:
          type: integer
          format: int32
        deviceType:
          type: string
          enum:
            - dimmer
            - switch
        zone:
          type: string
    LightingZoneStatus:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        lastUpdate:
          type: string
          format: date-time
        level:
          type: integer
          format: int32
      description: the status of the lighting zone.
      example:
        level: 0
        lastUpdate: 2000-01-23T04:56:07.000+00:00
        name: name
        id: id
    TemperatureSummary:
      type: object
      properties:
        zones:
          type: array
          items:
            $ref: "#/components/schemas/TemperatureZone"
        zoneStatus:
          type: array
          items:
            $ref: "#/components/schemas/TemperatureZoneStatus"
      description: ok
      example:
        zoneStatus:
          - name: name
            id: id
            units: fahrenheit
            value: 5
            timestamp: 2000-01-23T04:56:07.000+00:00
          - name: name
            id: id
            units: fahrenheit
            value: 5
            timestamp: 2000-01-23T04:56:07.000+00:00
        zones:
          - inputPosition: 6
            outputPosition: 1
            zone: zone
            name: name
            id: 0
          - inputPosition: 6
            outputPosition: 1
            zone: zone
            name: name
            id: 0
    TemperatureZone:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int32
          description: the unique identifier for the zone
        name:
          type: string
        inputPosition:
          type: integer
          format: int32
        outputPosition:
          type: integer
          format: int32
        zone:
          type: string
      description: a single temperature zone
      example:
        inputPosition: 6
        outputPosition: 1
        zone: zone
        name: name
        id: 0
    TemperatureZoneStatus:
      type: object
      required:
        - id
        - timestamp
        - value
      properties:
        id:
          type: string
          description: the unique identifier for the zone
        name:
          type: string
          description: the name of the zone
        value:
          type: integer
          format: int32
          description: the temperature in the zone
        units:
          type: string
          description: the temperature units
          default: fahrenheit
          enum:
            - celcius
            - fahrenheit
        timestamp:
          type: string
          format: date-time
          description: the timestamp when the temperature was measured
      description: status of a single zone
      example:
        name: name
        id: id
        units: fahrenheit
        value: 5
        timestamp: 2000-01-23T04:56:07.000+00:00
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
          example: everything is ok
      example:
        code: 0
        message: everything is ok
    HeaterState:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - on
            - off
        setPoint:
          type: integer
          format: int32
          description: goal temperature for heater
        units:
          type: string
          description: the temperature units
          default: fahrenheit
          enum:
            - celcius
            - fahrenheit
        timestamp:
          type: string
          format: date-time
          description: the timestamp when the temperature was measured
      example:
        setPoint: 0
        id: id
        state: on
        units: fahrenheit
        timestamp: 2000-01-23T04:56:07.000+00:00
    DeviceState:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: string
        previousValue:
          type: string
          description: the state before a set request; the change is confirmed by a later
            status frame
        lastUpdate:
          type: string
          format: date-time
      example:
        lastUpdate: 2000-01-23T04:56:07.000+00:00
        name: name
        id: id
        value: value
    WaterMode:
      type: object
      properties:
        mode:
          type: string
          enum:
            - pool
            - spa
            - spillover
        previousMode:
          type: string
        requestedAt:
          type: string
          format: date-time
    Heating:
      type: object
      properties:
        units:
          type: string
          enum:
            - fahrenheit
        target:
          type: string
          description: "the body the heaters drive toward now: pool, spa, or null while
            neither pump runs"
        minimum:
          type: integer
        maximum:
          type: integer
        setpointsReachController:
          type: boolean
          description: false while the server keeps the setpoints itself rather than
            reading and setting the controller's
        setpoints:
          type: object
          description: each body's setpoint for each device
          properties:
            pool:
              $ref: "#/components/schemas/DeviceSetpoints"
            spa:
              $ref: "#/components/schemas/DeviceSetpoints"
        devices:
          type: object
          properties:
            heater1:
              $ref: "#/components/schemas/HeatingDevice"
            heatpump:
              $ref: "#/components/schemas/HeatingDevice"
        estimate:
          type: object
          allOf:
            - $ref: "#/components/schemas/HeatingEstimate"
          nullable: true
          description: how long until the water reaches its setpoint; null unless the
            pump runs and a heat source is calling for heat
    DeviceSetpoints:
      type: object
      properties:
        heater1:
          type: integer
        heatpump:
          type: integer
    HeatingDevice:
      type: object
      properties:
        enabled:
          type: boolean
          description: switched on (the heater in Auto); null until the controller has
            reported it
        heating:
          type: boolean
          description: actually producing heat
        callingForHeat:
          type: boolean
          description: enabled, and its water is below the setpoint
        body:
          type: string
          description: the body it drives toward, as target
        setpoint:
          type: integer
          description: its setpoint for that body
        temperature:
          type: number
          description: that body's latest temperature
    Setpoint:
      type: object
      properties:
        body:
          type: string
        device:
          type: string
        setpoint:
          type: integer
        units:
          type: string
    SetpointChange:
      type: object
      properties:
        body:
          type: string
        device:
          type: string
        setpoint:
          type: integer
        previousSetpoint:
          type: integer
        units:
          type: string
    SystemInfo:
      type: object
      properties:
        service:
          type: string
          enum:
            - pool-controller
        version:
          type: string
        apiVersion:
          type: string
          description: the version of this API, as in info.version
        commit:
          type: string
          description: the short git commit the server was built from, ending in
            -dirty if it had uncommitted changes, or unknown
        startedAt:
          type: string
          format: date-time
    EventEntry:
      type: object
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          description: status, info, control, action, failed or unrecognized
        user:
          type: string
          description: the account that acted; only on action events
        summary:
          type: string
          description: what happened, in a sentence
        details:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: number
    EventPage:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventEntry"
        next:
          type: string
          description: cursor for the following page; null when there are no more events
    HistoryPoint:
      type: object
      properties:
        t:
          type: string
          format: date-time
          description: when the reading was recorded, or when its bucket starts
        v:
          type: number
          description: the reading, or for a bucket the average weighted by how long each
            value held
        min:
          type: number
          description: a bucket's lowest value
        max:
          type: number
          description: a bucket's highest value
    HistorySeries:
      type: object
      properties:
        name:
          type: string
          description: a reading name, or heating:<pool|spa>:<heater1|valve4> for the times
            that source was warming that body
        resolution:
          type: integer
          description: the bucket length in seconds, or 0 for every reading as recorded
        before:
          $ref: "#/components/schemas/HistoryPoint"
        points:
          type: array
          items:
            $ref: "#/components/schemas/HistoryPoint"
        downsampled:
          type: boolean
          description: true when the points are buckets rather than readings
    HistoryAvailability:
      type: object
      properties:
        timeZone:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        earliest:
          type: string
          description: the first day (YYYY-MM-DD) with pool, spa or salt readings
        days:
          type: array
          description: only the days with readings, oldest first
          items:
            type: object
            properties:
              date:
                type: string
                description: YYYY-MM-DD in the server's time zone
              readings:
                type: integer
    Settings:
      type: object
      properties:
        timeZone:
          type: string
          description: the IANA time zone calendar days follow
        timeZoneSource:
          type: string
          enum:
            - configured
            - system
            - default
          description: configured by an admin, detected from the host, or UTC because
            neither was available
        detectedTimeZone:
          type: string
          description: the host's time zone, or null when it couldn't be found
        rawRetentionDays:
          type: integer
        minimumRetentionDays:
          type: integer
        maximumRetentionDays:
          type: integer
        location:
          type: object
          allOf:
            - $ref: "#/components/schemas/Location"
          nullable: true
          description: where weather is fetched for, or null when no zip code is set
        heatingEstimateDisplay:
          type: string
          enum:
            - remaining
            - readyAt
          description: how every app shows when heating will be done; the minutes left,
            or the time of day it will be ready
        heatingRules:
          $ref: "#/components/schemas/HeatingRules"
        preheatMarginMinutes:
          type: integer
          description: minutes a scheduled preheat starts earlier than it needs to
    HeatingRules:
      type: object
      description: °F per hour each heat source warms each body of water, standing in for
        what history hasn't taught the model; a body without a model is timed by its rules
        alone, and a model without a rate for a source borrows that source's rule
      properties:
        pool:
          $ref: "#/components/schemas/HeatingRule"
        spa:
          $ref: "#/components/schemas/HeatingRule"
    HeatingRule:
      type: object
      properties:
        heater:
          type: number
          minimum: 0.1
          maximum: 120
        heatPump:
          type: number
          minimum: 0.1
          maximum: 120
    TaskChange:
      type: object
      required:
        - "on"
      properties:
        "on":
          type: boolean
    SpaPreheatChange:
      type: object
      required:
        - "on"
      properties:
        "on":
          type: boolean
        readyAt:
          type: string
          format: date-time
          nullable: true
          description: when the spa should be at its setpoint; absent, null or a time it
            can't make starts the preheat now
    Tasks:
      type: object
      properties:
        pool:
          type: object
          properties:
            "on":
              type: boolean
        spaPreheat:
          type: object
          properties:
            "on":
              type: boolean
            scheduled:
              type: object
              nullable: true
              description: a preheat waiting to start, or null
              properties:
                readyAt:
                  type: string
                  format: date-time
                startAt:
                  type: string
                  format: date-time
                  description: when it will start, worked out again every minute
                leadMinutes:
                  type: integer
                leadFrom:
                  type: string
                  enum:
                    - history
                    - rule
                    - mixed
                  description: what timed it, as an estimate's basis says
                fromTemperature:
                  type: number
                setpoint:
                  type: integer
                requestedBy:
                  type: string
                  nullable: true
        spaParty:
          type: object
          properties:
            "on":
              type: boolean
        dark:
          type: boolean
          description: whether it's dark at the pool, so a spa party turns the lights on
    SettingsUpdate:
      type: object
      properties:
        timeZone:
          type: string
          nullable: true
          description: an IANA time zone such as America/New_York, or null for the host's
        rawRetentionDays:
          type: integer
        zipCode:
          type: string
          nullable: true
          description: a five-digit US zip code to fetch weather for, or null or empty to
            stop
        heatingEstimateDisplay:
          type: string
          enum:
            - remaining
            - readyAt
        heatingRules:
          type: object
          description: 'the rules to change, such as {"spa": {"heater": 25}}; the rest stay
            as they are'
          properties:
            pool:
              $ref: "#/components/schemas/HeatingRule"
            spa:
              $ref: "#/components/schemas/HeatingRule"
        preheatMarginMinutes:
          type: integer
    Location:
      type: object
      properties:
        zipCode:
          type: string
        countryCode:
          type: string
        placeName:
          type: string
          description: the town and state, such as Orlando, FL
        latitude:
          type: number
        longitude:
          type: number
    Weather:
      type: object
      properties:
        configured:
          type: boolean
          description: whether a zip code is set
        location:
          type: object
          nullable: true
          properties:
            zipCode:
              type: string
            placeName:
              type: string
        today:
          type: object
          allOf:
            - $ref: "#/components/schemas/WeatherDay"
          nullable: true
        fetchedAt:
          type: string
          format: date-time
          nullable: true
        stale:
          type: boolean
          description: true when the forecast is more than three hours old or missing
    WeatherDay:
      type: object
      properties:
        date:
          type: string
          description: YYYY-MM-DD in the server's time zone
        high:
          type: number
          nullable: true
          description: °F
        low:
          type: number
          nullable: true
          description: °F
        condition:
          type: string
          nullable: true
          enum:
            - sunny
            - partly-cloudy
            - cloudy
            - fog
            - rain
            - snow
            - storm
            - null
        weatherCode:
          type: integer
          nullable: true
          description: the WMO weather interpretation code
        precipitationProbability:
          type: number
          nullable: true
          description: the day's highest chance of rain, in percent
        sunrise:
          type: string
          format: date-time
          nullable: true
        sunset:
          type: string
          format: date-time
          nullable: true
    Job:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        intervalSeconds:
          type: integer
        scheduled:
          type: boolean
          description: false when this process only runs jobs when asked
        running:
          type: boolean
        nextRunAt:
          type: string
          format: date-time
        lastStartedAt:
          type: string
          format: date-time
        lastFinishedAt:
          type: string
          format: date-time
        lastDurationMs:
          type: integer
        lastResult:
          type: string
          enum:
            - ok
            - failed
        lastError:
          type: string
        lastSummary:
          type: string
        runs:
          type: integer
        more:
          type: boolean
          description: only from a run; true when the job has more to do, as while
            catching up on old history, and runs again in a moment
    ReprocessEventType:
      type: string
      description: a kind of event the server makes from controller frames
      enum:
        - info
        - status
        - control
        - failed
        - unrecognized
    HeatingEstimate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
            - unreachable
            - noModel
            - noReading
            - insufficientData
          description: "ready: minutes and readyAt say when. unreachable: the air is too
            cold for the sources to reach the setpoint (reachesAtMost). noModel: no
            model has been saved for this body. noReading: the water or air
            temperature isn't known. insufficientData: the model has nothing for a
            source that is on. Older servers sent settling, with no estimate, for the
            first minutes after the pump started; with heating rules, noModel and
            insufficientData no longer happen."
        settling:
          type: boolean
          description: the pump has only just started, so the sensor may still show the
            water that sat in the pipes and the estimate may change once it settles
        basis:
          type: string
          enum:
            - history
            - rule
            - mixed
          description: "history: learned from history; rule: the body has no model, so the
            admin's heating rules timed it; mixed: a source at work has no learned rate and
            borrowed its rule"
        ruleSources:
          type: array
          description: the sources at work whose rate came from a rule
          items:
            type: string
            enum:
              - heater1
              - heatpump
        body:
          type: string
        temperature:
          type: number
        setpoint:
          type: integer
          description: the highest setpoint among the sources calling for heat
        airTemperature:
          type: number
          nullable: true
        minutes:
          type: integer
          nullable: true
          description: minutes until the setpoint is reached, when ready
        readyAt:
          type: string
          format: date-time
          nullable: true
        reachesAtMost:
          type: number
          nullable: true
        sources:
          type: array
          description: the heat sources calling for heat
          items:
            type: string
            enum:
              - heater1
              - heatpump
        rate:
          type: object
          nullable: true
          description: the water's rate of change now in °F per hour, and what makes it up
          properties:
            net:
              type: number
            heater:
              type: number
              nullable: true
            heatPump:
              type: number
              nullable: true
            solar:
              type: number
            loss:
              type: number
        model:
          type: object
          nullable: true
          properties:
            calculatedAt:
              type: string
              format: date-time
            windows:
              type: integer
            rSquared:
              type: number
              nullable: true
            rmse:
              type: number
              nullable: true
            airRange:
              type: array
              nullable: true
              items:
                type: number
            notes:
              type: array
              items:
                type: string
        display:
          type: string
          enum:
            - remaining
            - readyAt
          description: how the server is set to have apps show it
        timeZone:
          type: string
          description: the zone readyAt is shown in
    HeatingModelState:
      type: object
      properties:
        model:
          type: object
          allOf:
            - $ref: "#/components/schemas/HeatingModel"
          nullable: true
        defaultRange:
          $ref: "#/components/schemas/HeatingRange"
    HeatingRange:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
    HeatingModel:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          nullable: true
        range:
          $ref: "#/components/schemas/HeatingRange"
        timeZone:
          type: string
          nullable: true
        bodies:
          type: object
          properties:
            pool:
              $ref: "#/components/schemas/HeatingBodyModel"
            spa:
              $ref: "#/components/schemas/HeatingBodyModel"
    HeatingBodyModel:
      type: object
      required:
        - available
      properties:
        available:
          type: boolean
        reason:
          type: string
          description: why there is no model for this body, when there isn't
        heater:
          type: number
          nullable: true
          description: °F per hour the heater adds; null when not known
        heatPump:
          type: object
          nullable: true
          properties:
            base:
              type: number
              description: °F per hour at 60°F air
            slope:
              type: number
              description: °F per hour for each °F of air above 60
            referenceAirTemperature:
              type: number
            minimumAirTemperature:
              type: number
              nullable: true
              description: the air below which it adds nothing
        loss:
          type: number
          description: the share per hour of the water's excess over the air that is lost
        solar:
          type: number
          description: °F per hour full sun adds
        windows:
          $ref: "#/components/schemas/HeatingWindowCounts"
        outliers:
          type: integer
        rSquared:
          type: number
          nullable: true
        rmse:
          type: number
        airRange:
          type: array
          nullable: true
          items:
            type: number
        waterRange:
          type: array
          nullable: true
          items:
            type: number
        heatPumpAirRange:
          type: array
          nullable: true
          items:
            type: number
        notes:
          type: array
          items:
            type: string
    HeatingWindowCounts:
      type: object
      properties:
        heater:
          type: integer
        heatpump:
          type: integer
        both:
          type: integer
        cooling:
          type: integer
        total:
          type: integer
    HeatingScanRequest:
      type: object
      properties:
        from:
          type: string
          format: date-time
          description: the first moment looked at; the start of history by default
        to:
          type: string
          format: date-time
          description: where looking ends; 2026, when the simulator began, by default
    HeatingScan:
      type: object
      required:
        - id
        - state
      properties:
        id:
          type: string
        state:
          type: string
          enum:
            - waiting
            - running
            - finished
            - failed
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        requestedBy:
          type: string
          nullable: true
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        through:
          type: string
          format: date-time
          nullable: true
        scanned:
          type: integer
        gaps:
          type: integer
          description: stretches with no events from the controller, where nothing is known
        summary:
          type: object
          nullable: true
          description: what was found, once finished
          properties:
            windows:
              type: integer
            suitable:
              type: integer
            bodies:
              type: object
              description: for each body, for each kind of window, the windows found, the
                suitable ones and their hours
              additionalProperties:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    windows:
                      type: integer
                    suitable:
                      type: integer
                    hours:
                      type: number
            reasons:
              type: array
              items:
                type: object
                properties:
                  reason:
                    type: string
                  count:
                    type: integer
        error:
          type: string
          nullable: true
    HeatingWindows:
      type: object
      properties:
        scanId:
          type: string
        windows:
          type: array
          items:
            $ref: "#/components/schemas/HeatingWindow"
    HeatingWindow:
      type: object
      properties:
        id:
          type: string
        body:
          type: string
          enum:
            - pool
            - spa
        sources:
          type: string
          enum:
            - heater
            - heatpump
            - both
            - cooling
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        hours:
          type: number
        readings:
          type: integer
        startTemperature:
          type: number
          nullable: true
        endTemperature:
          type: number
          nullable: true
        waterTemperature:
          type: number
          nullable: true
          description: the average over the window
        airTemperature:
          type: number
          nullable: true
        sun:
          type: number
          nullable: true
        slope:
          type: number
          nullable: true
          description: °F per hour the water changed
        scatter:
          type: number
          nullable: true
        suitable:
          type: boolean
        reason:
          type: string
          nullable: true
    HeatingModelRequest:
      type: object
      required:
        - scanId
      properties:
        scanId:
          type: string
        excludeWindowIds:
          type: array
          items:
            type: string
        includeSources:
          type: array
          items:
            type: string
            enum:
              - heater
              - heatpump
              - both
              - cooling
    HeatingModelPreview:
      type: object
      properties:
        previewId:
          type: string
        scanId:
          type: string
        createdAt:
          type: string
          format: date-time
        range:
          $ref: "#/components/schemas/HeatingRange"
        timeZone:
          type: string
        windowsUsed:
          type: integer
        excludedWindows:
          type: integer
        sources:
          type: array
          items:
            type: string
        bodies:
          type: object
          properties:
            pool:
              $ref: "#/components/schemas/HeatingBodyModel"
            spa:
              $ref: "#/components/schemas/HeatingBodyModel"
        current:
          type: object
          allOf:
            - $ref: "#/components/schemas/HeatingModel"
          nullable: true
        samples:
          type: array
          items:
            type: object
            properties:
              body:
                type: string
              sources:
                type: string
              from:
                type: number
              to:
                type: number
              airTemperature:
                type: number
              status:
                type: string
              minutes:
                type: integer
                nullable: true
    HeatingModelSave:
      type: object
      required:
        - previewId
      properties:
        previewId:
          type: string
    ReprocessRequest:
      type: object
      required:
        - from
        - to
      properties:
        from:
          type: string
          format: date-time
          description: the first moment reprocessed
        to:
          type: string
          format: date-time
          description: reprocessing stops before this; a time after now is taken as now
        eventTypes:
          type: array
          description: the kinds of event to rewrite from their frames; every kind when
            left out or empty
          items:
            $ref: "#/components/schemas/ReprocessEventType"
        dryRun:
          type: boolean
          default: false
          description: count what would change without changing anything
    ReprocessRun:
      type: object
      required:
        - state
        - from
        - to
        - eventTypes
        - dryRun
        - scanned
        - examined
        - unchanged
        - updated
        - removed
        - unreadable
        - transitions
      properties:
        state:
          type: string
          enum:
            - waiting
            - running
            - finished
            - failed
          description: waiting for a maintenance job to finish, under way, done, or
            stopped by an error
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        eventTypes:
          type: array
          items:
            $ref: "#/components/schemas/ReprocessEventType"
        dryRun:
          type: boolean
        requestedBy:
          type: string
          nullable: true
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        through:
          type: string
          format: date-time
          nullable: true
          description: how far through the range the run has got
        scanned:
          type: integer
          description: events looked at, including those of other kinds that only carry
            the state forward
        examined:
          type: integer
          description: events of the chosen kinds read again from their frames
        unchanged:
          type: integer
        updated:
          type: integer
          description: events whose kind or readings changed
        removed:
          type: integer
          description: events whose frames change nothing, which the server would never
            have stored
        unreadable:
          type: integer
          description: events whose stored bytes hold no whole frame, left as they are
        transitions:
          type: array
          description: how many events went from one kind to another, or were removed
          items:
            type: object
            required:
              - from
              - to
              - count
            properties:
              from:
                type: string
              to:
                type: string
                description: the new kind, or removed
              count:
                type: integer
        error:
          type: string
          nullable: true
    History:
      type: object
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        timeZone:
          type: string
          description: the zone day buckets follow
        earliest:
          type: string
          format: date-time
          description: the oldest recorded reading of any kind
        series:
          type: array
          items:
            $ref: "#/components/schemas/HistorySeries"
    PanelDisplay:
      type: object
      required:
        - lines
        - blinking
        - timestamp
      properties:
        lines:
          type: array
          description: each line of the display, 20 characters wide
          items:
            type: string
        blinking:
          type: array
          description: for each line, the positions of characters the panel is blinking
          items:
            type: array
            items:
              type: integer
        timestamp:
          type: string
          format: date-time
          description: when the panel sent this text
      example:
        lines:
          - "      Saturday      "
          - "        6:42A       "
        blinking:
          - []
          - - 9
        timestamp: 2000-01-23T04:56:07.000+00:00
    PanelKeyPress:
      type: object
      properties:
        key:
          type: string
        requestedAt:
          type: string
          format: date-time
    StatusValue:
      type: object
      required:
        - name
        - category
        - value
        - timestamp
      properties:
        name:
          type: string
          description: the reading name, as stored by the server
        category:
          type: string
          description: status for device switches, info for measurements from the display
          enum:
            - status
            - info
        value:
          type: number
          description: 1 or 0 for switches; the measured value for info readings; for check
            system reason, how many reasons the panel has given since check system went on
        message:
          type: string
          description: only on check system reason, while there are any; the panel's words for
            each reason, separated by commas, such as "Low Salt, No Flow-Filter Pump"
        timestamp:
          type: string
          format: date-time
          description: when this value was recorded
      example:
        name: filter
        category: status
        value: 1
        timestamp: 2000-01-23T04:56:07.000+00:00
    DeviceRegistrationInfo:
      type: object
      properties:
        uri:
          type: string
          format: uri
          example: http://10.0.0.220:3000
        id:
          type: string
          format: uuid
          example: 0729a580-2240-11e6-9eb5-0002a5d5c51b
      example:
        id: 0729a580-2240-11e6-9eb5-0002a5d5c51b
        uri: http://10.0.0.220:3000
