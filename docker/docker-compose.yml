version: '2.0'

services:
  nginx-proxy:
    image: rhbroberg/nginx-proxy
    container_name: nginx-reverse-proxy
    restart: always
    depends_on:
      - web
    # 443 is the service; 80 answers LetsEncrypt's challenges and redirects to https
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/nginx/conf.d
      - /etc/nginx/vhost.d
      - /usr/share/nginx/html
      - /path/to/certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
    logging:
      options:
        max-size: "4m"
        max-file: "10"

  nginx-letsencrypt:
    image: rhbroberg/docker-letsencrypt-nginx-proxy-companion
    container_name: nginx-letsencrypt
    restart: always
    volumes_from:
      - nginx-proxy
    depends_on:
      - nginx-proxy
    volumes:
      - /path/to/certs:/etc/nginx/certs:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      options:
        max-size: "2m"
        max-file: "10"

  mongo:
    image: mongo
    ports:
      - 27017:27017
      - 27018:27018
    volumes:
      - /data/db:/data/db
      - /data/configdb:/data/configdb
    command: bash -c "rm -f /data/db/mongod.lock && mongod --journal"
    restart: always

  # the web page, on port 80; it forwards the REST API to the pool service, so the iOS app and
  # the page share one address
  web:
    image: rhbroberg/pool-web
    build: ../web
    restart: always
    environment:
      - VIRTUAL_HOST=pool.mystic.onthegrid.net
      - LETSENCRYPT_HOST=pool.mystic.onthegrid.net
      - LETSENCRYPT_EMAIL=rhbroberg@yahoo.com
      # the proxy serves https on 443 and forwards it here
      - VIRTUAL_PORT=80
      - POOL_API_URL=http://pool:3000
    depends_on:
      - pool
    expose:
      - "80"
    logging:
      options:
        max-size: "4m"
        max-file: "10"

  pool:
    image: rhbroberg/pool-controller
    restart: always
    environment:
      # reached through the web service rather than directly through the proxy
      - NODE_ENV=docker-test
      # signs login tokens; export POOL_JWT_SECRET on the host, never commit it
      - JWT_SECRET=${POOL_JWT_SECRET}
    depends_on:
      - mongo
    expose:
      - "3000"
    devices:
    - "/dev/ttyUSB0:/dev/ttyUSB0"
    logging:
      options:
        max-size: "50m"


