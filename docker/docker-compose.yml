# The pool controller on the Raspberry Pi. Settings are in .env; the secrets POOL_JWT_SECRET and
# POOL_HE_DDNS_KEY come from the shell, never a committed file. See README.md.
name: pool-controller

services:
  # https for the web service; its certificate is proved through DNS, so no port has to be open
  # to the internet for the CA, only for whoever uses the page or the iOS app
  caddy:
    image: rhbroberg/pool-caddy
    build: ./caddy
    restart: always
    depends_on:
      - web
    ports:
      - "${POOL_HTTP_PORT:-80}:${POOL_HTTP_PORT:-80}"
      - "${POOL_HTTPS_PORT:-443}:${POOL_HTTPS_PORT:-443}"
      - "${POOL_HTTPS_PORT:-443}:${POOL_HTTPS_PORT:-443}/udp"
    environment:
      - POOL_HOSTNAME=${POOL_HOSTNAME:?set POOL_HOSTNAME in .env}
      - POOL_ACME_EMAIL=${POOL_ACME_EMAIL:?set POOL_ACME_EMAIL in .env}
      - POOL_ACME_CA=${POOL_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      - POOL_HE_DDNS_KEY=${POOL_HE_DDNS_KEY}
      - POOL_HTTP_PORT=${POOL_HTTP_PORT:-80}
      - POOL_HTTPS_PORT=${POOL_HTTPS_PORT:-443}
    volumes:
      # certificates, keys and the ACME account; losing them means asking the CA again
      - caddy_data:/data
      - caddy_config:/config
    logging:
      options:
        max-size: "4m"
        max-file: "10"

  # the web page; it forwards the REST API to the pool service, so the iOS app and the page share
  # one address
  web:
    image: rhbroberg/pool-web
    build:
      context: ../web
      args:
        # the Makefile sets it; shown in the page's Settings
        - POOL_GIT_COMMIT=${POOL_GIT_COMMIT:-unknown}
    restart: always
    environment:
      - POOL_API_URL=http://pool:3000
    depends_on:
      - pool
    expose:
      - "80"
    logging:
      options:
        max-size: "4m"
        max-file: "10"

  pool:
    image: rhbroberg/pool-controller
    build:
      context: ..
      args:
        # the Makefile sets it; reported by GET /system/info
        - POOL_GIT_COMMIT=${POOL_GIT_COMMIT:-unknown}
    restart: always
    environment:
      # reached through the web service rather than directly through the proxy
      - NODE_ENV=docker-test
      # signs login tokens; export POOL_JWT_SECRET on the host, never commit it
      - JWT_SECRET=${POOL_JWT_SECRET}
      # 1 lets passwords sign in even if an admin turned them off; for getting back in
      - POOL_FORCE_PASSWORD_SIGNIN=${POOL_FORCE_PASSWORD_SIGNIN:-}
      # where sign-in services send the browser back; normally worked out from the proxies' headers
      - POOL_PUBLIC_URL=${POOL_PUBLIC_URL:-}
    depends_on:
      mongo:
        condition: service_healthy
    expose:
      - "3000"
    devices:
      - "${POOL_SERIAL_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0"
    # the Pi's time zone, so history days start at the pool's midnight; without these the
    # container runs on UTC until an admin sets a zone in Server Maintenance
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    logging:
      options:
        max-size: "50m"
        max-file: "3"

  # reached only by the pool service, on the compose network; no port is published
  mongo:
    # 5.0 and later need an ARMv8.2 CPU, which a Raspberry Pi 4 lacks, and 4.4 releases after
    # 4.4.18 stop on it with an illegal instruction
    image: ${POOL_MONGO_IMAGE:-mongo:4.4.18}
    restart: always
    volumes:
      - ${POOL_MONGO_DATA:-/data/db}:/data/db
    healthcheck:
      # 4.4 has the mongo shell; 6.0 and later have only mongosh
      test: ["CMD-SHELL", "$$(command -v mongosh || command -v mongo) --quiet --eval 'quit(db.adminCommand(\"ping\").ok ? 0 : 1)'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
